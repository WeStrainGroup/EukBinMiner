name: eukbinminer
channels:
  - conda-forge
  - bioconda
dependencies:
  # BUSCO 6/SEPP currently requires the CPython 3.10 ABI.
  - python>=3.10,<3.11
  - remag=0.4.4
  - miniprot=0.18
  - concoct=1.1.0
  - biopython
  - metabat2=2.18_23_gc869c52
  - vamb=5.0.4
  - seqkit
  - eukcc=2.1.3
  - taxonkit
  - csvtk
  - busco=6
